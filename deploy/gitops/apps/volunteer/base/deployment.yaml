apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer-service
  labels:
    app: volunteer-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: volunteer-service
  template:
    metadata:
      labels:
        app: volunteer-service
    spec:
      serviceAccountName: volunteer-service
      # preStop (10 s) + tempo do próprio serviço para terminar o que
      # está em andamento, antes do kill.
      terminationGracePeriodSeconds: 60
      # Restrito (Pod Security Standards): a imagem já roda como uid 10001.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: volunteer-service
      containers:
        - name: volunteer-service
          image: volunteer-service
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            # Firestore com Workload Identity (KSA volunteer-service).
            - name: CLOUD_PROVIDER
              value: "gcp"
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: gcp-config
                  key: GCP_PROJECT_ID
            - name: FIRESTORE_COLLECTION
              value: "volunteers"
            - name: OTEL_SERVICE_NAME
              value: "volunteer-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 15
