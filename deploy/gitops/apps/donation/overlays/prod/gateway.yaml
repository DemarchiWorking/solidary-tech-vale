# Exposição pelo Gateway compartilhado (addons/gateway), só no listener
# HTTPS. O caminho chega inteiro ao serviço, que registra a rota com o
# prefixo (/donations).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: donation-service
spec:
  parentRefs:
    - name: solidarytech
      namespace: gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /donations
      backendRefs:
        - name: donation-service
          port: 8082
---
# O load balancer verifica /health (o padrão seria "/", que dá 404).
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: donation-service
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    config:
      type: HTTP
      httpHealthCheck:
        port: 8082
        requestPath: /health
  targetRef:
    group: ""
    kind: Service
    name: donation-service
---
# Dreno de conexões: o load balancer para de mandar tráfego para um pod
# antes de ele sair, para rollout e self-heal não darem 502.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: donation-service
spec:
  default:
    connectionDraining:
      drainingTimeoutSec: 30
  targetRef:
    group: ""
    kind: Service
    name: donation-service
