# Grafana em /grafana (serve_from_sub_path no grafana.ini, sem rewrite).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: solidarytech
      namespace: gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: grafana
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /grafana/api/health
  targetRef:
    group: ""
    kind: Service
    name: kube-prometheus-stack-grafana
