# SonarQube em /sonarqube (sonarWebContext no values.yaml). O CI usa esta
# URL como SONAR_HOST_URL.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarqube
spec:
  parentRefs:
    - name: solidarytech
      namespace: gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sonarqube
      backendRefs:
        - name: sonarqube-sonarqube
          port: 9000
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: sonarqube
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /sonarqube/api/system/status
  targetRef:
    group: ""
    kind: Service
    name: sonarqube-sonarqube
---
# Análises grandes levam tempo: mesmo limite de 120 s do ingress antigo.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: sonarqube
spec:
  default:
    timeoutSec: 120
  targetRef:
    group: ""
    kind: Service
    name: sonarqube-sonarqube
