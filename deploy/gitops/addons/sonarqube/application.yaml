apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-sonarqube
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://SonarSource.github.io/helm-chart-sonarqube
      chart: sonarqube
      targetRevision: 2026.4.1
      helm:
        releaseName: sonarqube
        valueFiles:
          - $values/deploy/gitops/addons/sonarqube/values.yaml

    - repoURL: https://github.com/DemarchiWorking/solidary-tech-vale.git
      targetRevision: HEAD
      ref: values

    - repoURL: https://github.com/DemarchiWorking/solidary-tech-vale.git
      targetRevision: HEAD
      path: deploy/gitops/addons/sonarqube
      directory:
        include: "route.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
