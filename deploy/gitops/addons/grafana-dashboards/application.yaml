apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-grafana-dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DemarchiWorking/solidary-tech-vale.git
    targetRevision: HEAD
    path: deploy/gitops/addons/grafana-dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
