# Coletor OpenTelemetry do ambiente local: recebe traces e métricas dos 4
# serviços e só imprime um resumo no log (docker compose logs otel-collector).
# Na nuvem, o coletor do GitOps (deploy/gitops/addons/otel-collector-gateway)
# envia para Prometheus, Loki e Datadog.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
