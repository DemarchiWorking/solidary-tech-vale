name: CI - donation-service

# Monorepo: só roda quando muda o próprio serviço (ou este workflow).
# Testa main e branch-gcp; publica a imagem no Artifact Registry e atualiza
# o GitOps só na branch padrão do repositório, a mesma que o ArgoCD
# acompanha (HEAD).
#
# Sem chave de service account: o job de publicação troca o token OIDC do
# GitHub pela SA ci-deployer (Workload Identity Federation, criada em
# infra/terraform/bootstrap), que só escreve no repositório de imagens.
# Variáveis do repositório (Settings > Secrets and variables > Actions):
#   GCP_WIF_PROVIDER  output workload_identity_provider do bootstrap
#   GCP_CI_SA         output ci_deployer_service_account do bootstrap
#   GCP_REGISTRY      output registry_url de envs/prod/infra
on:
  push:
    branches: [main, branch-gcp]
    paths:
      - "services/donation-service/**"
      - ".github/workflows/donation-service-ci.yaml"
  pull_request:
    branches: [main, branch-gcp]
    paths:
      - "services/donation-service/**"
      - ".github/workflows/donation-service-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Sem as variáveis GCP_* a imagem é construída e escaneada, mas não
  # publicada (o registry abaixo só serve de tag local).
  REGISTRY: ${{ vars.GCP_REGISTRY || 'registry-nao-configurado.invalid' }}
  IMAGE_NAME: donation-service
  GITOPS_APP_PATH: deploy/gitops/apps/donation/overlays/prod

# Os comandos de cada job rodam na pasta do serviço.
defaults:
  run:
    working-directory: services/donation-service

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/donation-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify go.sum is up to date
        run: |
          go mod tidy
          git diff --exit-code go.sum go.mod
          if [ -n "$(git status --porcelain go.sum)" ]; then
            echo "go.sum is missing. Please run 'go mod tidy' and commit go.sum."
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15
          working-directory: services/donation-service

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/donation-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        # Inclui o teste do PubSubSender contra o pstest (Pub/Sub em memória).
        run: go test -race -v -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: services/donation-service/coverage.out

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Sem SONAR_TOKEN cadastrado, a análise é pulada em vez de falhar.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: SonarQube não configurado
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN não cadastrado; análise do SonarQube pulada."

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
          path: services/donation-service

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: services/donation-service
          args: >
            -Dsonar.projectKey=donation-service
            -Dsonar.sources=.
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.exclusions=**/*_test.go

  build-scan-push:
    name: Build, Trivy Scan and Push
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      id-token: write # token OIDC para a federação de identidade
    outputs:
      publicado: ${{ steps.push.outputs.publicado }}
    env:
      # Publica só na branch padrão, fora de PR, e com as três variáveis.
      PUBLICAR: ${{ github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' && vars.GCP_REGISTRY != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_CI_SA != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: SCA - Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "services/donation-service"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: "true"

      # Só a tag do commit: o repositório do Artifact Registry tem tags
      # imutáveis (infra/terraform/envs/prod/infra), então não há :latest.
      - name: Build Docker image
        run: docker build -t "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA" .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: "true"

      - name: Publicação não configurada
        if: env.PUBLICAR != 'true' && github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        run: echo "::notice::Variáveis GCP_REGISTRY, GCP_WIF_PROVIDER e GCP_CI_SA não cadastradas; imagem testada, mas não publicada."

      - name: Autenticar no Google Cloud (Workload Identity Federation)
        id: auth
        if: env.PUBLICAR == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
          token_format: access_token

      - name: Host do Artifact Registry
        id: registry
        if: env.PUBLICAR == 'true'
        run: echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Login no Artifact Registry
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Push para o Artifact Registry
        id: push
        if: env.PUBLICAR == 'true'
        run: |
          docker push "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"
          echo "publicado=true" >> "$GITHUB_OUTPUT"

  update-gitops:
    name: Update GitOps
    runs-on: ubuntu-latest
    needs: build-scan-push
    # Só quando a imagem desta execução foi de fato publicada.
    if: needs.build-scan-push.outputs.publicado == 'true'
    # Uma atualização deste serviço por vez (a mais nova vence).
    concurrency:
      group: gitops-update-donation-service
      cancel-in-progress: false
    # O GitOps está neste mesmo repositório: basta o GITHUB_TOKEN, e o
    # commit feito com ele não dispara outros workflows.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update image tag
        run: |
          cd "$GITOPS_APP_PATH"
          kustomize edit set image "$IMAGE_NAME=$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$GITOPS_APP_PATH"
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "deploy: update $IMAGE_NAME to $GITHUB_SHA"
          # Outro serviço pode ter atualizado o GitOps no meio do caminho (um
          # push que mexe nos 4 serviços publica os 4 quase juntos): rebase
          # (arquivos diferentes, sem conflito) e tenta de novo. A espera
          # aleatória evita que os mesmos concorrentes colidam de novo. Um
          # grupo de concurrency comum aos 4 não serve: o GitHub cancela o
          # job pendente quando chega outro, e uma atualização se perderia.
          for tentativa in $(seq 1 10); do
            echo "push do GitOps: tentativa $tentativa de 10"
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((RANDOM % 8 + 2))
          done
          exit 1
