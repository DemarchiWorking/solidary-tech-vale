name: Self-Healing - volunteer-service

# Disparado via webhook do Datadog (Monitor -> Integração Webhook,
# @webhook-github-selfheal-volunteer-service, ver
# fiap-tc-5-terraform/datadog.tf) — só dispara se "volunteer-service"
# estiver em var.monitored_services.
#
# Monorepo: os 4 self-heals moram neste repositório; cada um escuta o
# próprio event_type (self-heal-volunteer-service) e só reinicia o seu serviço.
# O GitHub só dispara repository_dispatch pelos workflows da branch padrão.
#
#   POST https://api.github.com/repos/<owner>/<repo>/dispatches
#   Authorization: Bearer <GitHub PAT com escopo 'repo'>
#   Accept: application/vnd.github+json
#   {
#     "event_type": "self-heal-volunteer-service",
#     "client_payload": { "service": "volunteer-service", "alert_title": "...", "alert_id": "..." }
#   }

on:
  repository_dispatch:
    types: [self-heal-volunteer-service]
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVICE_NAME: volunteer-service
  NAMESPACE: volunteer

jobs:
  rollout-restart:
    name: kubectl rollout restart
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Self-Healing - rollout restart
        run: |
          echo "### Self-Healing acionado ###"
          echo "Serviço: ${{ env.SERVICE_NAME }}"
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Alerta: ${{ github.event.client_payload.alert_title || 'disparo manual' }}"
          kubectl rollout restart deployment/${{ env.SERVICE_NAME }} \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} \
            -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Evidência - pods após o restart
        if: always()
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
