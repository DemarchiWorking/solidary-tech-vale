name: CI - ngo-service

# Monorepo: só roda quando muda o próprio serviço (ou este workflow).
# Testa main e branch-azure; publica a imagem e atualiza o GitOps só na
# branch padrão do repositório, a mesma que o ArgoCD acompanha (HEAD).
on:
  push:
    branches: [main, branch-azure]
    paths:
      - "fiap-tc-5-ngo-service/**"
      - ".github/workflows/ngo-service-ci.yaml"
  pull_request:
    branches: [main, branch-azure]
    paths:
      - "fiap-tc-5-ngo-service/**"
      - ".github/workflows/ngo-service-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Sem a variável ACR_NAME a imagem é construída e escaneada, mas não
  # publicada (o nome abaixo só serve de tag local).
  ACR_NAME: ${{ vars.ACR_NAME || 'acr-nao-configurado' }}
  IMAGE_NAME: ngo-service
  GITOPS_APP_PATH: fiap-tc-5-gitops/apps/ngo/overlays/prod

# Os comandos de cada job rodam na pasta do serviço.
defaults:
  run:
    working-directory: fiap-tc-5-ngo-service

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 . --max-line-length=120 --exclude="test_*.py"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest test_app.py -v --cov=app --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: fiap-tc-5-ngo-service/coverage.xml

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Sem SONAR_TOKEN cadastrado, a análise é pulada em vez de falhar.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: SonarQube não configurado
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN não cadastrado; análise do SonarQube pulada."

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
          path: fiap-tc-5-ngo-service

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: fiap-tc-5-ngo-service
          args: >
            -Dsonar.projectKey=ngo-service
            -Dsonar.sources=.
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=test_*.py

  build-scan-push:
    name: Build, Trivy Scan and Push
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: SCA - Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "fiap-tc-5-ngo-service"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: "true"

      - name: Build Docker image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                        -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: "true"

      - name: Publicação não configurada
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' && vars.ACR_NAME == ''
        run: echo "::notice::Variável ACR_NAME não cadastrada; imagem testada, mas não publicada."

      - name: Login to ACR
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' && vars.ACR_NAME != ''
        uses: azure/docker-login@15c4aadf093404726ab2ff205b2cdd33fa6d054c # v2
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push to ACR
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' && vars.ACR_NAME != ''
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

  update-gitops:
    name: Update GitOps
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' && vars.ACR_NAME != ''
    # Uma atualização deste serviço por vez (a mais nova vence).
    concurrency:
      group: gitops-update-ngo-service
      cancel-in-progress: false
    # O GitOps está neste mesmo repositório: basta o GITHUB_TOKEN, e o
    # commit feito com ele não dispara outros workflows.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update image tag
        run: |
          cd ${{ env.GITOPS_APP_PATH }}
          kustomize edit set image ${{ env.IMAGE_NAME }}=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.GITOPS_APP_PATH }}"
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "deploy: update ${{ env.IMAGE_NAME }} to ${{ github.sha }}"
          # Outro serviço pode ter atualizado o GitOps no meio do caminho:
          # rebase (arquivos diferentes, sem conflito) e tenta de novo.
          for tentativa in 1 2 3; do
            echo "push do GitOps: tentativa $tentativa de 3"
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1
