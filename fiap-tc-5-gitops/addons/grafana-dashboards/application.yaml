apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-grafana-dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DemarchiWorking/solidary-tech-vale.git
    targetRevision: HEAD
    path: fiap-tc-5-gitops/addons/grafana-dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
